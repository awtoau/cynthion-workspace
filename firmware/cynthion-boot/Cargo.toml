[package]
name = "cynthion-boot"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Resident bootloader for the Cynthion r1.4 VexiiRiscv SoC"

# No riscv-rt, and that is a size decision with a correctness argument behind it.
#
# riscv-rt brings a trap vector, a `.bss` zeroing loop, a `.data` copy loop and the
# `_pre_init`/`_setup_interrupts` hooks. This image has no statics, takes no traps and
# runs before anything has been enabled, so all of it would be code that cannot execute.
# `_start` here is four instructions: set `sp`, jump.
[dependencies]

# Where the HyperRAM peripheral and its window are (#588): `src/hyperram.rs` names
# `cynthion_soc_pac::base::HYPERRAM*`; `scripts/check.py`'s `socmap` check holds it.
cynthion-soc-pac = { path = "../cynthion-soc-pac" }

[features]
# Declared and never enabled. `src/hyperram.rs` is the shell's file, compiled into this
# crate as a module, and it carries a `qemu` backend for `-M virt`. There is no QEMU
# bootloader -- virt jumps straight to the ELF entry point and has no block RAM at 0 to
# fall back into -- so this crate always builds the hardware side. Declaring the feature
# is what keeps the `cfg` a known one and the build warning-clean.
qemu = []

# Declared and never enabled, for the same reason `qemu` above is: `src/hyperram.rs`
# is the shell's file, compiled into this crate as a module, and its power-state half
# -- the CS# wake ladder and the power-loss canary (#315) -- reaches for a clock and a
# console this crate does not have. Declaring the feature is what keeps the `cfg` a
# known one and the build warning-clean.
image = []

# Size: `./scripts/soc_boot_size.py`. `opt-level = "z"` is the setting that matters.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Stated rather than relied on: riscv32imac-unknown-none-elf declares
# `panic-strategy = "abort"`, so this is what the target does regardless -- and rustc
# rejects `panic = "unwind"` for it, which is why there is no row for it above.
panic = "abort"
debug = true
