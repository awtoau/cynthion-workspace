[package]
name = "cynthion-soc"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Shell firmware for our VexiiRiscv SoC, on Cynthion r1.4 hardware"

# Current versions, because nothing constrains us to older ones. This is our SoC and
# our memory map, so there is no upstream to stay compatible with.
# `docs/upstream-boundary.md` has the policy.
#
# No HAL crate at all: the console needs core::fmt::Write, which is in core. That is
# what makes writeln! work, and it is about six lines to implement.
[dependencies]
riscv = "0.16"
riscv-rt = "0.18"

# Where every hardware peripheral is, generated from the SoC's own memory map by
# `scripts/soc_generate_pac.py`. Only `src/target.rs` refers to it, and only in
# its `not(feature = "qemu")` branch -- see the module comment there for why the
# register accessors it also contains are not used.
#
# Not optional and not behind the `qemu` feature. An optional dependency would
# mean the QEMU build compiled a different `target.rs` than the one that ships,
# and this crate is types and constants: nothing it defines is referenced in a
# QEMU build, so nothing it defines reaches the binary.
cynthion-soc-pac = { path = "../cynthion-soc-pac" }

# RTIC, for the `rtic` feature below and nothing else. `riscv-clint-backend`
# rather than `riscv-mecall-backend` because the SoC already wires the CLINT's
# `msip` to the CPU's software-interrupt input (`vexii_hello_soc.py`), so
# pending a task is one MMIO store rather than a trap through `ecall`.
#
# It brings a second copy of the `riscv` crate: riscv-slic 0.2.0 pins 0.12.1
# while this crate and rtic both use 0.16. Both are inline-asm wrappers with no
# symbols of their own, so they coexist -- but it is 16 packages against the 14
# this crate has today, and that is the whole graph doubling for one feature.
rtic = { version = "2.3", features = ["riscv-clint-backend"], optional = true }

# Build the same shell against QEMU's `-M virt` instead of the FPGA.
#
# Off by default, and it must stay that way: the hardware image is the product, and a
# feature that had to be remembered on every build would eventually be forgotten on one.
#
# It switches the `#[cfg]` branches in src/target.rs -- addresses, and a flash stand-in
# -- and the HyperRAM MMIO primitives for a RAM array. Nothing else, deliberately: the
# QEMU gate is only evidence about the board while the two builds share source.
#
# scripts/soc_test.py drives it and pairs it with memory-qemu.x. Building it by hand
# without that linker script links .text into the flash window, where virt has no
# memory, and produces an image that traps on the first fetch.
[features]
qemu = []

# The concurrency-model skeletons that produced the table in
# `docs/soc-concurrency-models.md`. They are measurement artefacts, not code the
# shell uses, and they are kept because a size comparison nobody can rebuild is
# an assertion rather than a measurement. `scripts/soc_model_probe.py` builds
# them.
models = []

# The #115 real-workload measurement: a synthetic USB device-emulation load
# (`src/workload.rs`) and the `usb` shell command that runs it. Off, and every
# hook into `src/main.rs` and `src/irq.rs` is `#[cfg]`-gated rather than
# runtime-gated, so the default build does not compile a byte of it.
# `scripts/soc_workload.py` drives it.
workload = []

# Preemption alone: the ~200-line priority dispatcher in `src/dispatch.rs`, with
# the Type-C deferral ported onto it. Implies `workload` because the dispatcher's
# task table names the workload's two jobs -- the point of the feature is to run
# the same jobs somewhere else, so a build with one and not the other would have
# nothing to measure.
preempt = ["workload"]

# The RTIC spike (`docs/rtic-adoption.md`, #115). Off, and the shell does not
# know it exists: everything it adds is in `src/bin/rtic.rs`, which cargo does
# not build without the feature, so `src/main.rs` is untouched and the shipping
# image is byte-identical either way. `scripts/rtic_probe.py` builds it.
#
# `critical-section-single-hart` rides on the feature rather than sitting in
# `[dependencies]` because riscv-slic's generated code calls
# `critical_section::with` and nothing links without an implementation -- and
# registering one globally is not something a build that does not use RTIC
# should be doing.
rtic = ["dep:rtic", "riscv/critical-section-single-hart"]

# The spike, as a second binary rather than a `#[cfg]` through `src/main.rs`.
#
# `#[rtic::app]` emits its own `#[no_mangle] fn main`, so it cannot coexist with
# riscv-rt's `#[entry]` in one binary -- the choice was a `#[cfg(not(...))]` on
# the shell's entry point, which makes 1,700 lines dead code under the feature,
# or this. `required-features` means cargo skips the target entirely when the
# feature is off, so the default build does not compile, link or lint it.
[[bin]]
name = "cynthion-soc-rtic"
path = "src/bin/rtic.rs"
required-features = ["rtic"]

[profile.release]
# "z" for SPEED, not size. Measured on the board (`./dev.py optlevel`, #167):
#
#     level   .text     ipc   flash seq   flash rnd
#     z       36160   0.302     9.63 MB/s   0.66
#     s       43348   0.171    11.11        0.68
#     3       64576   0.056    11.57        0.65
#
# 79% more code costs 5.4x the IPC. It is the I-cache, not the link: 4 KiB,
# direct-mapped, one way, against 36 KB of `.text`, and every miss is a full
# quad-SPI transaction. Note flash throughput RISES as the code grows -- the link
# got faster while the CPU got five times slower, so what changed is how often it
# has to go there.
#
# Re-measure if the cache geometry changes (#110).
opt-level = "z"
lto = true
codegen-units = 1
debug = true         # kept -- costs nothing in the binary, and .elf is what gets read

# Declared explicitly, because cargo auto-discovers `src/bin/*.rs` and builds
# them all otherwise -- which put `model_embassy.rs` into the default build with
# no `embassy_executor` to link against.
[[bin]]
name = "model-bare"
path = "src/bin/model_bare.rs"
required-features = ["models"]

[[bin]]
name = "model-coop"
path = "src/bin/model_coop.rs"
required-features = ["models"]

[[bin]]
name = "model-coop-swqueue"
path = "src/bin/model_coop_swqueue.rs"
required-features = ["models"]

[[bin]]
name = "model-coop-hwtimer"
path = "src/bin/model_coop_hwtimer.rs"
required-features = ["models"]

[[bin]]
name = "model-embassy"
path = "src/bin/model_embassy.rs"
required-features = ["embassy"]
