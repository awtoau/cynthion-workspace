[package]
name = "cynthion-soc"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Shell firmware for our VexiiRiscv SoC, on Cynthion r1.4 hardware"

# Current versions, because nothing constrains us to older ones. This is our SoC and
# our memory map, so there is no upstream to stay compatible with.
# `docs/upstream-boundary.md` has the policy.
#
# No HAL crate at all: the console needs core::fmt::Write, which is in core. That is
# what makes writeln! work, and it is about six lines to implement.
[dependencies]
riscv = "0.16"
riscv-rt = "0.18"

# Where every hardware peripheral is, generated from the SoC's own memory map by
# `scripts/soc_generate_pac.py`. Only `src/target.rs` refers to it, and only in
# its `not(feature = "qemu")` branch -- see the module comment there for why the
# register accessors it also contains are not used.
#
# Not optional and not behind the `qemu` feature. An optional dependency would
# mean the QEMU build compiled a different `target.rs` than the one that ships,
# and this crate is types and constants: nothing it defines is referenced in a
# QEMU build, so nothing it defines reaches the binary.
cynthion-soc-pac = { path = "../cynthion-soc-pac" }

# Build the same shell against QEMU's `-M virt` instead of the FPGA.
#
# Off by default, and it must stay that way: the hardware image is the product, and a
# feature that had to be remembered on every build would eventually be forgotten on one.
#
# It switches the `#[cfg]` branches in src/target.rs -- addresses, and a flash stand-in
# -- and the HyperRAM MMIO primitives for a RAM array. Nothing else, deliberately: the
# QEMU gate is only evidence about the board while the two builds share source.
#
# scripts/soc_test.py drives it and pairs it with memory-qemu.x. Building it by hand
# without that linker script links .text into the flash window, where virt has no
# memory, and produces an image that traps on the first fetch.
[features]
qemu = []

[profile.release]
# "z" for SPEED, not size. Measured on the board (`./dev.py optlevel`, #167):
#
#     level   .text     ipc   flash seq   flash rnd
#     z       36160   0.302     9.63 MB/s   0.66
#     s       43348   0.171    11.11        0.68
#     3       64576   0.056    11.57        0.65
#
# 79% more code costs 5.4x the IPC. It is the I-cache, not the link: 4 KiB,
# direct-mapped, one way, against 36 KB of `.text`, and every miss is a full
# quad-SPI transaction. Note flash throughput RISES as the code grows -- the link
# got faster while the CPU got five times slower, so what changed is how often it
# has to go there.
#
# Re-measure if the cache geometry changes (#110).
opt-level = "z"
lto = true
codegen-units = 1
debug = true         # kept -- costs nothing in the binary, and .elf is what gets read
