[package]
name = "cynthion-soc"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Shell firmware for our VexiiRiscv SoC, on Cynthion r1.4 hardware"

# Current versions, because nothing constrains us to older ones. This is our SoC and
# our memory map, so there is no upstream to stay compatible with.
# `docs/upstream-boundary.md` has the policy.
#
# No HAL crate at all: the console needs core::fmt::Write, which is in core. That is
# what makes writeln! work, and it is about six lines to implement.
[dependencies]
riscv = { version = "0.16", features = ["critical-section-single-hart"] }
riscv-rt = "0.18"

# Where every hardware peripheral is, generated from the SoC's own memory map by
# `scripts/soc_generate_pac.py`. Only `src/target.rs` refers to it, and only in
# its `not(feature = "qemu")` branch -- see the module comment there for why the
# register accessors it also contains are not used.
#
# Not optional and not behind the `qemu` feature. An optional dependency would
# mean the QEMU build compiled a different `target.rs` than the one that ships,
# and this crate is types and constants: nothing it defines is referenced in a
# QEMU build, so nothing it defines reaches the binary.
cynthion-soc-pac = { path = "../cynthion-soc-pac" }

# RTIC, for the `rtic` feature below and nothing else. `riscv-clint-backend`
# rather than `riscv-mecall-backend` because the SoC already wires the CLINT's
# `msip` to the CPU's software-interrupt input (`top.py`), so
# pending a task is one MMIO store rather than a trap through `ecall`.
#
# It brings a second copy of the `riscv` crate: riscv-slic 0.2.0 pins 0.12.1
# while this crate and rtic both use 0.16. Both are inline-asm wrappers with no
# symbols of their own, so they coexist -- but it is 16 packages against the 14
# this crate has today, and that is the whole graph doubling for one feature.
rtic = { version = "2.3", features = ["riscv-clint-backend"] }

# Build the same shell against QEMU's `-M virt` instead of the FPGA.
#
# Off by default, and it must stay that way: the hardware image is the product, and a
# feature that had to be remembered on every build would eventually be forgotten on one.
#
# It switches the `#[cfg]` branches in src/target.rs -- addresses, and a flash stand-in
# -- and the HyperRAM MMIO primitives for a RAM array. Nothing else, deliberately: the
# QEMU gate is only evidence about the board while the two builds share source.
#
# scripts/soc_test.py drives it and pairs it with memory-qemu.x. Building it by hand
# without that linker script links .text into the flash window, where virt has no
# memory, and produces an image that traps on the first fetch.
[features]
qemu = []

# The concurrency-model skeletons that produced the table in
# `docs/rtic.md`. They are measurement artefacts, not code the
# shell uses, and they are kept because a size comparison nobody can rebuild is
# an assertion rather than a measurement. `scripts/soc_model_probe.py` builds
# them.
models = []

# The Embassy skeleton in `src/bin/model_embassy.rs`. Optional dependencies, so
# nothing here reaches the shipping image -- the same arrangement as `rtic`.
#
# Declared because the row it produces in `docs/rtic.md` was
# measured with these added LOCALLY and never committed, which made a number in
# a table that nobody could re-take.
embassy = ["dep:embassy-executor", "dep:embassy-sync", "dep:static_cell",
           "riscv/critical-section-single-hart"]

# The #115 real-workload measurement: a synthetic USB device-emulation load
# (`src/workload.rs`) and the `usb` shell command that runs it. Off, and every
# hook into `src/main.rs` and `src/irq.rs` is `#[cfg]`-gated rather than
# runtime-gated, so the default build does not compile a byte of it.
# `scripts/soc_workload.py` drives it.
workload = []

# Preemption alone: the ~200-line priority dispatcher in `src/dispatch.rs`, with
# the Type-C deferral ported onto it. Implies `workload` because the dispatcher's
# task table names the workload's two jobs -- the point of the feature is to run
# the same jobs somewhere else, so a build with one and not the other would have
# nothing to measure.
preempt = ["workload"]

# `rtic` USED TO BE A FEATURE. Not one any more (#245).
#
# `#[rtic::app]` in `src/rtic_app.rs` is THE dispatcher: shell has no other
# entry point, the PAC1954's REFRESH cycle is a periodic task the 1 ms tick
# releases, no superloop to fall back to. The feature existed to compare the
# two with exactly one variable between them; comparison ran on hardware,
# decision followed, and a losing path kept afterwards is a dead branch nobody
# dares touch.
#
# `riscv/critical-section-single-hart` moves to `[dependencies]` with it:
# riscv-slic's generated code calls `critical_section::with`, nothing links
# without an implementation. Rode on the feature because registering one
# globally isn't something a non-RTIC build should do -- every build uses RTIC
# now.
#
# Other `rtic*` features below are unaffected: they gate the #115 measurement
# spikes (separate binaries under `src/bin/`, not the shell), off by default
# for the reason `qemu` above is off -- the hardware image is the product.

# The non-RTIC half of the USB port (#115): moondancer's control-transfer path
# in moondancer's own shape, a superloop over an event queue.
#
# Its own feature rather than riding on `rtic`, because `rtic` also turns on
# `riscv/critical-section-single-hart`, which registers a global
# `critical_section` implementation. A control build that carried it would not
# be a control build.
usbport = []

# The #115 workload on RTIC: `src/bin/workload_rtic.rs`, the third dispatcher
# for the same `src/workload.rs`. Implies `workload` because the point is to run
# the identical jobs somewhere else -- the same argument `preempt` makes -- and
# `dep:rtic` without going through the `rtic` feature so that the shell's
# `src/bin/rtic.rs` is not dragged in.
#
# Not `preempt`: the two are alternative dispatchers for the same tasks and a
# build with both would pend each job twice.
#
# **This feature alone does not link.** It supplies no `critical_section`
# implementation, and riscv-slic's generated code calls `critical_section::with`.
# Pick one of the two below; they exist because the choice of implementation IS
# one of the measurements.
# Gates the two #115 measurement spikes under `src/bin/`, which are separate
# binaries and not the shell. They used to ride on the `rtic` feature; that
# feature is gone because RTIC is no longer optional, and a binary gated on
# nothing would be built by every `cargo build`.
rticspike = []

rticwl = ["workload"]

# The control binary for the one above: the same workload, the same front end,
# the same modules, dispatched by a superloop. Its own feature rather than plain
# `workload` because the shell also has that, and the size difference that means
# anything is between two binaries of the same shape -- differencing the shell
# against an RTIC binary measures the shell.
wlbare = ["workload"]

# The port with `riscv`'s own single-hart critical section: the build every
# latency and size figure is taken from, and the one a product would ship.
rticcs = ["rticwl", "riscv/critical-section-single-hart"]

# The instrumented variant, and NOT the build any latency figure is taken from:
# it puts two `csrr minstret`s and two atomic adds inside every pend, every lock,
# every dispatch and every critical section.
#
# It registers its OWN `critical_section` implementation -- the same single-hart
# body with the counter reads around it -- which is why it cannot also enable
# `riscv/critical-section-single-hart`: two implementations are a duplicate
# symbol at link. So `rticcs` and `rticprobe` are mutually exclusive by
# construction, and the harness builds them separately.
rticprobe = ["rticwl", "dep:critical-section"]

# The naive `#[idle]`: wait on the `#[shared]` resource rather than on an atomic.
#
# A configuration, not a bug in RTIC, and the reason it is a feature rather than
# a footnote is that it costs something measurable -- `lock` raises the SLIC
# threshold to the resource's ceiling, which is the event task's own priority, so
# every poll is a window in which the event task cannot be dispatched. The two
# builds differ in that one line. See `src/bin/workload_rtic.rs`'s `idle`.
rticspin = ["rticwl"]

# The CLINT monotonic, `src/bin/mono_rtic.rs`. Issue 4 of the six #115 raises,
# and the one with no evidence before this: `rtic-monotonics` has no CLINT
# backend, but it DOES have two RISC-V ones (esp32c3, esp32c6), so what was
# needed was a `TimerQueueBackend` and not a port of the crate.
#
# `fugit` and `rtic-time` are named directly because the monotonic type is
# written out rather than made by the crate's per-part macro -- the macro exists
# to hardcode a frequency, and this one is `target::TIME_HZ`.
rticmono = ["riscv/critical-section-single-hart",
            "dep:rtic-monotonics", "dep:rtic-time", "dep:fugit"]

# The #245 spike, kept as a second binary -- for a changed reason: no longer
# the only way to have RTIC here, but the smallest one. Two tasks that count
# and a PLIC front end, so its `.text` is the RTIC runtime plus almost nothing,
# which is what makes `scripts/rtic_probe.py`'s size figure mean something;
# `src/rtic_app.rs` runs the whole shell and can't answer that question. Also
# the standing answer to "does RTIC accept this machine at all" and where a
# bring-up problem gets isolated.
#
# `#[rtic::app]` emits its own `#[no_mangle] fn main`, so it can't coexist with
# riscv-rt's `#[entry]` in one binary. #245 took the other horn: a
# `#[cfg(not(feature = "rtic"))]` on the shell's entry point, made cheap by
# factoring the loop body out first -- `boot`, `housekeeping` and `consoles`
# are shared, so nothing is dead code under either setting.
#
# `required-features` means cargo skips the target entirely when the feature
# is off, so the default build doesn't compile, link or lint it -- `rticspike`
# gates it so a default `cargo build` still produces the shell and nothing
# else.
[[bin]]
name = "cynthion-soc-rtic"
path = "src/bin/rtic.rs"
required-features = ["rticspike"]

# The USB port, both halves. Same source in `src/usb.rs` and `src/usb_report.rs`,
# two dispatchers, so the size difference between them is RTIC and nothing else.
# `scripts/soc_usb_probe.py` builds them and `scripts/soc_usb_test.py` runs them
# under QEMU.
[[bin]]
name = "usb-rtic"
path = "src/bin/usb_rtic.rs"
required-features = ["rticspike"]

[[bin]]
name = "usb-bare"
path = "src/bin/usb_bare.rs"
required-features = ["usbport"]

[profile.release]
# "z" for SPEED, not size: bigger code thrashes the I-cache, and `.text` is
# fetched from SPI flash so every miss is a full quad-SPI transaction.
# Counter-intuitively `-O3` was the SLOWEST. Numbers in #167.
#
# STALE: measured against a 4 KiB I-cache and 36 KB of `.text`. Both have since
# moved -- cache is 8 KiB, `.text` is ~56 KB -- so re-run `./dev.py optlevel`.
opt-level = "z"
lto = true
codegen-units = 1
debug = true         # kept -- costs nothing in the binary, and .elf is what gets read

# Declared explicitly, because cargo auto-discovers `src/bin/*.rs` and builds
# them all otherwise -- which put `model_embassy.rs` into the default build with
# no `embassy_executor` to link against.
# For `--features rticprobe` only, whose `critical_section` implementation is
# instrumented rather than `riscv`'s. Already in the graph -- riscv-slic depends
# on it -- so this declares the direct use rather than adding a package.
[dependencies.critical-section]
version = "1.2"
optional = true
# `RawRestoreState` is `()` unless a width is chosen, and a single-hart
# implementation has to return whether IT was the acquire that cleared
# `mstatus.MIE` -- otherwise a nested release re-enables interrupts inside the
# outer critical section. `riscv`'s own `critical-section-single-hart` turns this
# same feature on for the same reason.
features = ["restore-state-bool"]

[dependencies.rtic-monotonics]
version = "2.2"
optional = true
default-features = false

[dependencies.rtic-time]
version = "2.0"
optional = true

[dependencies.fugit]
version = "0.3"
optional = true

[dependencies.embassy-executor]
version = "0.10"
optional = true
features = ["platform-riscv32", "executor-thread"]

[dependencies.embassy-sync]
version = "0.7"
optional = true

[dependencies.static_cell]
version = "2"
optional = true

[[bin]]
name = "model-bare"
path = "src/bin/model_bare.rs"
required-features = ["models"]

[[bin]]
name = "model-coop"
path = "src/bin/model_coop.rs"
required-features = ["models"]

[[bin]]
name = "model-coop-swqueue"
path = "src/bin/model_coop_swqueue.rs"
required-features = ["models"]

[[bin]]
name = "model-coop-hwtimer"
path = "src/bin/model_coop_hwtimer.rs"
required-features = ["models"]

[[bin]]
name = "model-embassy"
path = "src/bin/model_embassy.rs"
required-features = ["embassy"]

# The workload's third dispatcher. `required-features` names the base feature;
# a build must add `rticcs` or `rticprobe` on top of it to link, and the comment
# on those two says why.
[[bin]]
name = "mono-rtic"
path = "src/bin/mono_rtic.rs"
required-features = ["rticmono"]

[[bin]]
name = "workload-bare"
path = "src/bin/workload_bare.rs"
required-features = ["wlbare"]

[[bin]]
name = "workload-rtic"
path = "src/bin/workload_rtic.rs"
required-features = ["rticwl"]
